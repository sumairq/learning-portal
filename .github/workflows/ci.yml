name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        working-directory: api
        run: npm ci

      - name: Run linting
        run: npm run lint

  typecheck:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        working-directory: api
        run: npm ci

      - name: Run Typecheck
        working-directory: api
        run: npm run typecheck

  test:
    name: Jest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        working-directory: api
        run: npm ci

      - name: Run tests
        working-directory: api
        run: npm run test
